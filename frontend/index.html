<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MYCO CAUSAS // Biotecnología Fungi & Hongos Funcionales</title>
    <meta name="description" content="Laboratorio de biotecnología fúngica especializado en extractos puros estandarizados de Melena de León, Reishi, Cordyceps y Chaga. Certificación HPLC en Perú." />
    <meta name="keywords" content="hongos funcionales, melena de leon, reishi, cordyceps, biotecnologia fungi, extractos puros, nootropicos peru, myco causas" />
    <meta name="author" content="Myco Causas Biotech Lab" />
    <meta name="theme-color" content="#030806" />

    <!-- Open Graph / Redes Sociales -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Myco Causas" />
    <meta property="og:title" content="MYCO CAUSAS // Biotecnología Fungi & Hongos Funcionales" />
    <meta property="og:description" content="Fórmulas biotecnológicas miceliales de máxima biodisponibilidad y pureza certificada HPLC. Envíos a todo el Perú." />
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MYCO CAUSAS // Biotecnología Fungi" />
    <meta name="twitter:description" content="Extractos funcionales estandarizados con trazabilidad por lote HPLC." />
    <meta name="twitter:image" content="/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
    </noscript>
  </head>
  <body>
    <div id="root">
      <!-- Preloader instantáneo inline en HTML: Elimina la pantalla negra en móviles mientras descarga React -->
      <div id="app-initial-loader" style="position:fixed;inset:0;background:#030806;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
        <div style="position:relative;width:56px;height:56px;display:flex;align-items:center;justify-content:center;">
          <div style="position:absolute;inset:0;border-radius:50%;border:2px solid rgba(0,245,160,0.12);border-top-color:#00f5a0;animation:loaderSpin 0.85s cubic-bezier(0.5,0,0.5,1) infinite;"></div>
          <div style="position:absolute;inset:7px;border-radius:50%;border:2px dashed rgba(0,245,160,0.25);border-bottom-color:#00f5a0;animation:loaderSpinRev 1.3s linear infinite;"></div>
          <div style="width:10px;height:10px;background:#00f5a0;border-radius:50%;box-shadow:0 0 16px #00f5a0;"></div>
        </div>
        <div style="margin-top:18px;text-align:center;">
          <div style="font-size:12px;font-weight:700;letter-spacing:0.25em;color:#fff;text-transform:uppercase;">MYCO<span style="color:#00f5a0;">CAUSAS</span></div>
          <div style="font-size:9px;letter-spacing:0.15em;color:#6b7280;margin-top:4px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;">BIOTECH LAB // INICIALIZANDO...</div>
        </div>
        <style>
          @keyframes loaderSpin{to{transform:rotate(360deg)}}
          @keyframes loaderSpinRev{to{transform:rotate(-360deg)}}
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
