# =============================================================================
# MYCO CAUSAS v2 — CONFIGURACIÓN NGINX PARA SERVIDOR AWS (EC2 / LIGHTSAIL)
# =============================================================================
# Copiar este archivo a: /etc/nginx/sites-available/myco-causas.conf
# Y crear el enlace simbólico:
#   sudo ln -s /etc/nginx/sites-available/myco-causas.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name tudominio.com www.tudominio.com; # Reemplazar con tu dominio o IP pública de AWS

    # Ruta a la compilación estática del Frontend Vite en el servidor
    root /var/www/myco-causasv2/frontend/dist;
    index index.html;

    # Tamaño máximo para subida de comprobantes e imágenes
    client_max_body_size 25M;

    # Compresión GZIP para máximo rendimiento y velocidad de carga
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Cabeceras de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 1. Rutas de la API REST -> Proxy hacia Node.js Express (puerto 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # 2. Archivos estáticos subidos (/uploads) -> Proxy al backend
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. Cache agresivo para assets compilados de Vite (CSS, JS, imágenes estáticas)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 4. Frontend SPA (Single Page Application) -> Redirige a index.html para React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bloquear acceso a archivos ocultos (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
